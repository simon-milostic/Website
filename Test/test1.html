<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Assesment Page</title>
        <link rel="stylesheet" href="../CSS/main_page.css">
    </head>

    <body>
        <h1>Course Sign Up Page</h1>
        <form method="get">
            <p>Please note: First Name, Last Name, Email, Password are required</p>

            <label for="first">First Name:</label>
            <input type="text" name="" id="first" placeholder="First Name" required>

            <label for="last">Last Name:</label>
            <input type="text" name="" id="last" placeholder="Last Name" required>
            
            <p></p>

            <label for="mail">Email:</label>
            <input type="email" name="" id="mail" placeholder="name@email.com" required>

            <label for="pass">Password:</label>
            <input type="password" name="" id="pass" required>

            <p></p>

            <p>Are you over the age of 18?</p>
            
            <label for="yes">Yes:</label>
            <input id="yes" type="radio" name="but" value="y">

            <label for="no">No:</label>
            <input id="no" type="radio" name="but" value="n">

            <p>Do you have a Card or PayPal?</p>

            <select name="payment">
                <option value="0">Card</option>
                <option value="1">PayPal</option>
            </select>

            <p></p>
            
            <input type="submit" value="Submit">

        </form>
    </body>

</html>
